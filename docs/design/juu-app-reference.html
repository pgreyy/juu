<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Juu · product reference (exact design)</title>

<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=Space+Grotesk:wght@500;700&amp;family=Inter:wght@400;500;600&amp;family=Silkscreen:wght@400;700&amp;family=Space+Mono:wght@400;700&amp;family=Martian+Mono:wght@400;600;700&amp;family=JetBrains+Mono:wght@400;600&amp;family=Bricolage+Grotesque:wght@500;700;800&amp;family=DM+Mono:wght@400;500&amp;family=VT323&amp;family=Instrument+Serif&amp;family=Syne:wght@600;700;800&amp;family=Azeret+Mono:wght@400;500;600&amp;family=Red+Hat+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid currentColor;outline-offset:3px}
@keyframes juuTick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.juu-tick{display:flex;width:max-content;animation:juuTick 52s linear infinite}
.juu-tickwrap:hover .juu-tick{animation-play-state:paused}
.juu-car{transition:top .5s cubic-bezier(.2,.8,.2,1)}
.juu-logo .ic-logo{display:flex}.juu-logo .ic-toggle{display:none}
.juu-logo:hover .ic-logo,.juu-logo:focus-visible .ic-logo,.juu-logo.open .ic-logo{display:none}
.juu-logo:hover .ic-toggle,.juu-logo:focus-visible .ic-toggle,.juu-logo.open .ic-toggle{display:flex}
@media (prefers-reduced-motion: reduce){.juu-tick{animation:none}.juu-car{transition:none}}
</style>

</head>
<body>
<!-- Juu product reference. Open this file in a browser to see and click through the exact design.
     The template below is the markup, the Component class is the logic and sample data.
     A tiny renderer at the bottom draws it. The real app should be rebuilt in the project's own stack. -->
<div id="app"></div>
<script type="text/plain" id="juu-template">

<div style="min-height: 1400px; background: {{t.bg}}; color: {{t.ink}}; font-family: {{t.fB}}; padding: 24px 28px 32px; box-sizing: border-box; display: grid; grid-template-columns: {{gridCols}}; gap: 20px; align-items: start">



<div style="min-width: 0; background-color: {{t.surf}}; background-image: {{t.tex}}; background-size: 24px 24px; border: 1.5px solid {{t.rule}}; border-radius: {{t.rS}}; min-height: 1340px; display: flex; overflow: clip; box-shadow: {{t.shadow}}">

<template data-scif value="{{L.rail}}" hint-placeholder-val="{{ false }}">
<nav aria-label="Main" style="flex: 0 0 {{railW}}; background: {{t.bg}}; border-right: 1.5px solid {{t.rule2}}; padding: 22px 12px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px">
<button type="button" class="juu-logo {{logoCls}}" onClick="{{toggleRail}}" aria-label="{{railToggleLabel}}" aria-expanded="{{railExp}}" title="{{railToggleLabel}}" style="width: 52px; height: 52px; margin: 0 auto 14px; background: transparent; border: 0; color: {{t.ink}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><span class="ic-logo" style="width: 32px; height: 32px; align-items: center; justify-content: center"><template data-scif value="{{logo.stack}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="100%" height="100%" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="17" width="18" height="4"/><rect x="6" y="11" width="12" height="4"/><rect x="9" y="5" width="6" height="4"/></svg></template><template data-scif value="{{logo.ascent}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M4 21h16M6 17h12M8 13h8"/><path d="M12 3l5 6H7z" fill="currentColor" stroke="none"/></svg></template><template data-scif value="{{logo.stepj}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="100%" height="100%" viewBox="0 0 24 24" fill="currentColor"><path d="M14 3h5v11a7 7 0 0 1-7 7H5v-5h7a2 2 0 0 0 2-2z"/><rect x="5" y="3" width="5" height="5"/></svg></template><template data-scif value="{{logo.tendots}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="100%" height="100%" viewBox="0 0 24 24" fill="currentColor"><circle cx="16" cy="3.5" r="1.9" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="3.5" r="1.9"/><circle cx="8" cy="8" r="1.9"/><circle cx="16" cy="8" r="1.9"/><circle cx="8" cy="12.5" r="1.9"/><circle cx="16" cy="12.5" r="1.9"/><circle cx="8" cy="17" r="1.9"/><circle cx="16" cy="17" r="1.9"/><circle cx="8" cy="21.5" r="1.9"/><circle cx="16" cy="21.5" r="1.9"/></svg></template><template data-scif value="{{logo.burst}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="3.2" fill="currentColor" stroke="none"/><path d="M12 1v5M12 18v5M1 12h5M18 12h5M4.2 4.2l3.5 3.5M16.3 16.3l3.5 3.5M4.2 19.8l3.5-3.5M16.3 7.7l3.5-3.5"/></svg></template><template data-scif value="{{logo.word}}" hint-placeholder-val="{{ false }}"><span style="font-family: {{t.fD}}; font-weight: 700; font-size: 14px; letter-spacing: 0.04em; line-height: 1">JUU</span></template></span><span class="ic-toggle" style="width: 26px; height: 26px; align-items: center; justify-content: center"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></span></button>
<template data-scfor list="{{tabs}}" as="x" hint-placeholder-count="8">
<button type="button" aria-current="{{x.cur}}" aria-label="{{x.label}}" title="{{x.label}}" onClick="{{x.go}}" style="min-height: 56px; display: flex; align-items: center; justify-content: {{railJustify}}; gap: 8px; padding: 0 12px; background: {{x.railBg}}; color: {{x.railFg}}; border: 1.5px solid {{x.railLine}}; border-radius: {{t.rB}}; font-family: {{t.fN}}; font-size: 13px; cursor: pointer">
<span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 50%; background: {{x.dot}}; flex: 0 0 6px"></span>
<span aria-hidden="true" style="display: flex"><template data-scif value="{{x.ic.dash}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V7l6-4 6 4v14M6 11h12M6 15h12M10 21v-3h4v3"/></svg></template><template data-scif value="{{x.ic.pos}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5 9-5zM3 12.5l9 5 9-5M3 17l9 5 9-5"/></svg></template><template data-scif value="{{x.ic.doors}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V3h10v18M3 21h18M13 12h.01"/></svg></template><template data-scif value="{{x.ic.bank}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-5 9 5M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 21h18"/></svg></template><template data-scif value="{{x.ic.market}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12V4h8l10 10-8 8L3 12z"/><circle cx="8" cy="8" r="1.5"/></svg></template><template data-scif value="{{x.ic.jackpot}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v5a4 4 0 0 1-8 0V4zM8 6H4a3 3 0 0 0 4 4M16 6h4a3 3 0 0 1-4 4M12 13v4M8 21h8M9.5 17h5"/></svg></template><template data-scif value="{{x.ic.agents}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="8" width="14" height="11" rx="2"/><path d="M12 4v4M9 13h.01M15 13h.01M9.5 16h5"/></svg></template><template data-scif value="{{x.ic.board}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21v-7h6v7M9 21V9h6v12M15 21v-5h6v5M3 21h18"/></svg></template></span>
<template data-scif value="{{railOpen}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="font-family: {{t.fB}}; font-size: 13px; font-weight: {{x.railW}}; white-space: nowrap">{{x.label}}</span></template>
</button>
</template>
</nav>
</template>

<div style="flex: 1; min-width: 0; display: flex; flex-direction: column">

<template data-scif value="{{L.brandHead}}" hint-placeholder-val="{{ true }}">
<header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding: 22px 32px 14px">
<div style="display: flex; align-items: center; gap: 14px; flex-wrap: wrap">
<template data-scif value="{{logoIcon}}" hint-placeholder-val="{{ true }}"><span style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center"><template data-scif value="{{logo.stack}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="100%" height="100%" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="17" width="18" height="4"/><rect x="6" y="11" width="12" height="4"/><rect x="9" y="5" width="6" height="4"/></svg></template><template data-scif value="{{logo.ascent}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M4 21h16M6 17h12M8 13h8"/><path d="M12 3l5 6H7z" fill="currentColor" stroke="none"/></svg></template><template data-scif value="{{logo.stepj}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="100%" height="100%" viewBox="0 0 24 24" fill="currentColor"><path d="M14 3h5v11a7 7 0 0 1-7 7H5v-5h7a2 2 0 0 0 2-2z"/><rect x="5" y="3" width="5" height="5"/></svg></template><template data-scif value="{{logo.tendots}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="100%" height="100%" viewBox="0 0 24 24" fill="currentColor"><circle cx="16" cy="3.5" r="1.9" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="3.5" r="1.9"/><circle cx="8" cy="8" r="1.9"/><circle cx="16" cy="8" r="1.9"/><circle cx="8" cy="12.5" r="1.9"/><circle cx="16" cy="12.5" r="1.9"/><circle cx="8" cy="17" r="1.9"/><circle cx="16" cy="17" r="1.9"/><circle cx="8" cy="21.5" r="1.9"/><circle cx="16" cy="21.5" r="1.9"/></svg></template><template data-scif value="{{logo.burst}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="3.2" fill="currentColor" stroke="none"/><path d="M12 1v5M12 18v5M1 12h5M18 12h5M4.2 4.2l3.5 3.5M16.3 16.3l3.5 3.5M4.2 19.8l3.5-3.5M16.3 7.7l3.5-3.5"/></svg></template></span></template>
<span style="font-family: {{t.fD}}; font-weight: 700; font-size: 38px; letter-spacing: 0.04em; line-height: 1; text-shadow: {{t.glow}}">JUU</span>
<span style="font-family: {{t.fN}}; font-size: 12px; letter-spacing: 0.12em; color: {{t.muted}}">THE MUSDASH TOTE</span>
</div>
<button type="button" style="height: 46px; padding: 0 16px; background: transparent; color: {{t.ink}}; border: 1.5px solid {{t.rule}}; border-radius: {{t.rB}}; font-family: {{t.fN}}; font-size: 13px; cursor: pointer">0x5Ac8…C5eA</button>
</header>
</template>

<template data-scif value="{{L.railHead}}" hint-placeholder-val="{{ false }}">
<header style="display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 22px 32px 14px">
<span style="font-family: {{t.fD}}; font-weight: 700; font-size: 30px; letter-spacing: 0.04em; text-shadow: {{t.glow}}">{{curLabelUp}}</span>
<span style="font-family: {{t.fN}}; font-size: 12px; color: {{t.muted}}; letter-spacing: 0.1em">MEZO TESTNET</span>
</header>
</template>

<template data-scif value="{{L.consoleHead}}" hint-placeholder-val="{{ false }}">
<header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 20px; border-bottom: 1.5px solid {{t.rule}}; font-family: {{t.fN}}; font-size: 14px">
<span style="text-shadow: {{t.glow}}">{{cmd}}<span aria-hidden="true" style="display: inline-block; width: 9px; height: 16px; margin-left: 4px; vertical-align: middle; background: {{t.ink}}"></span></span>
<span style="color: {{t.muted}}">JUU · MEZO TESTNET · 0x5Ac8…C5eA</span>
</header>
</template>

<div class="juu-tickwrap" role="region" aria-label="Market ticker" style="overflow: hidden; border-top: 1px solid {{t.rule2}}; border-bottom: 1px solid {{t.rule2}}">
<div class="juu-tick">
<template data-scfor list="{{ticker}}" as="k" hint-placeholder-count="20">
<div aria-hidden="{{k.dup}}" style="display: flex; align-items: center; gap: 10px; padding: 8px 26px; border-right: 1px solid {{t.rule2}}; white-space: nowrap; min-height: 44px">
<template data-scif value="{{k.oi}}" hint-placeholder-val="{{ false }}">
<span aria-hidden="true" style="position: relative; width: 40px; height: 40px; display: inline-block; flex: 0 0 40px">
<template data-scfor list="{{raysMini}}" as="r" hint-placeholder-count="36"><span style="position: absolute; left: 50%; top: 50%; width: {{r.w}}; height: {{r.len}}; margin-left: -1px; background: {{r.c}}; transform-origin: 50% 0; transform: rotate({{r.deg}}) translateY(7px)"></span></template>
</span>
</template>
<span style="font-family: {{t.fN}}; font-size: 11px; letter-spacing: 0.12em; color: {{t.muted}}">{{k.label}}</span>
<span style="font-family: {{t.fN}}; font-size: 18px; font-weight: 500; color: {{k.c}}; text-shadow: {{t.glow}}">{{k.value}}</span>
<template data-scif value="{{k.sub}}" hint-placeholder-val="{{ false }}"><span style="font-family: {{t.fN}}; font-size: 12px; color: {{k.subC}}">{{k.sub}}</span></template>
</div>
</template>
</div>
</div>

<template data-scif value="{{L.topNav}}" hint-placeholder-val="{{ true }}">
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 2px 6px; padding: 0 24px; border-bottom: 1.5px solid {{t.rule}}">
<template data-scfor list="{{tabs}}" as="x" hint-placeholder-count="8">
<button type="button" aria-current="{{x.cur}}" onClick="{{x.go}}" style="min-height: 48px; padding: 0 10px; background: transparent; border: 0; border-bottom: 4px solid {{x.line}}; color: {{x.lineFg}}; font-family: {{t.fN}}; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer">{{x.label}}</button>
</template>
</nav>
</template>

<template data-scif value="{{L.stageNav}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px; padding: 16px 24px; border-bottom: 1.5px solid {{t.rule}}">
<button type="button" onClick="{{prevTab}}" aria-label="Previous page" style="width: 48px; height: 48px; background: transparent; color: {{t.ink}}; border: 1.5px solid {{t.rule}}; border-radius: {{t.rB}}; font-size: 18px; cursor: pointer">◀</button>
<span style="min-width: 240px; text-align: center; font-family: {{t.fD}}; font-weight: 700; font-size: 26px; letter-spacing: 0.06em; text-shadow: {{t.glow}}">{{curLabelUp}}</span>
<button type="button" onClick="{{nextTab}}" aria-label="Next page" style="width: 48px; height: 48px; background: transparent; color: {{t.ink}}; border: 1.5px solid {{t.rule}}; border-radius: {{t.rB}}; font-size: 18px; cursor: pointer">▶</button>
<button type="button" onClick="{{toggleMenu}}" aria-expanded="{{menuExp}}" style="min-height: 48px; padding: 0 16px; background: {{t.strong}}; color: {{t.onStrong}}; border: 0; border-radius: {{t.rB}}; font-family: {{t.fN}}; font-size: 12px; letter-spacing: 0.1em; cursor: pointer">{{menuLabel}}</button>
</div>
<template data-scif value="{{menuOpen}}" hint-placeholder-val="{{ false }}">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; padding: 16px 24px; border-bottom: 1.5px solid {{t.rule}}">
<template data-scfor list="{{tabs}}" as="x" hint-placeholder-count="8">
<button type="button" aria-current="{{x.cur}}" onClick="{{x.goClose}}" style="min-height: 64px; text-align: left; padding: 10px 14px; background: {{x.bg}}; color: {{x.fg}}; border: 1.5px solid {{t.rule}}; border-radius: {{t.rB}}; font-family: {{t.fD}}; font-size: 16px; cursor: pointer"><span style="display: block; font-family: {{t.fN}}; font-size: 11px">{{x.code}}</span>{{x.label}}</button>
</template>
</div>
</template>
</template>

<main style="flex: 1; min-width: 0; padding: {{L.mainPad}}">
<template data-scif value="{{isDash}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-wrap: wrap; flex-direction: {{L.dashDir}}; gap: 28px">
<section aria-label="The tower" style="flex: {{L.towerFlex}}; min-width: 0">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px">
<h1 style="margin: 0; font-family: {{t.fD}}; font-weight: 700; font-size: 34px; letter-spacing: 0.04em; text-shadow: {{t.glow}}">MUSDASH · {{towerName}}</h1>
<template data-scif value="{{agaruzo}}" hint-placeholder-val="{{ false }}">
<div role="status" style="background: {{t.strong}}; color: {{t.onStrong}}; padding: 10px 18px; border-radius: {{t.rB}}; display: flex; align-items: baseline; gap: 12px; box-shadow: {{t.shadow}}">
<span style="font-family: {{t.fD}}; font-weight: 700; font-size: 24px; letter-spacing: 0.06em">AGARUZO!</span>
<span style="font-family: {{t.fN}}; font-size: 12px">FLOOR {{posFloor}}</span>
</div>
</template>
</div>

<template data-scif value="{{tw.bars}}" hint-placeholder-val="{{ true }}">
<div style="display: grid; grid-template-columns: minmax(0, 1fr) 110px minmax(0, 1fr) 120px; gap: 10px; padding-bottom: 8px; border-bottom: 1.5px solid {{t.rule}}; font-family: {{t.fN}}; font-size: 11px; letter-spacing: 0.12em">
<span style="text-align: right; color: {{t.bull}}">▲ BULL POOL</span><span style="text-align: center; color: {{t.muted}}">FLOOR</span><span style="color: {{t.bear}}">BEAR POOL ▼</span><span style="color: {{t.muted}}">STATUS</span>
</div>
<template data-scfor list="{{floors}}" as="f" hint-placeholder-count="10">
<div style="display: grid; grid-template-columns: minmax(0, 1fr) 110px minmax(0, 1fr) 120px; gap: 10px; align-items: center; height: 58px; border-bottom: 1px solid {{t.rule2}}; background: {{f.rowBg}}">
<div style="display: flex; justify-content: flex-end; align-items: center; gap: 10px">
<template data-scif value="{{f.you}}" hint-placeholder-val="{{ false }}"><span style="background: {{t.strong}}; color: {{t.onStrong}}; font-family: {{t.fN}}; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: {{t.rB}}">YOU</span></template>
<span style="font-family: {{t.fN}}; font-size: 13px; color: {{t.muted}}">{{f.bullAmt}}</span>
<span aria-hidden="true" style="height: 16px; width: {{f.bullW}}; background: {{t.bullBar}}; border-radius: {{t.rBar}}"></span>
</div>
<button type="button" onClick="{{f.pick}}" aria-label="Pick floor {{f.num}}" style="display: flex; align-items: baseline; justify-content: center; gap: 6px; height: 50px; background: transparent; border: 0; color: {{t.ink}}; cursor: pointer">
<span style="font-family: {{t.fD}}; font-weight: 700; font-size: 28px; color: {{f.numC}}">{{f.num}}</span>
<span style="font-family: {{t.fN}}; font-size: 13px; color: {{t.muted}}">{{f.lev}}×</span>
</button>
<div style="display: flex; align-items: center; gap: 10px">
<span aria-hidden="true" style="height: 16px; width: {{f.bearW}}; box-sizing: border-box; background: {{t.bearBar}}; border: 1.5px solid {{t.bearLine}}; border-radius: {{t.rBar}}"></span>
<span style="font-family: {{t.fN}}; font-size: 13px; color: {{t.muted}}">{{f.bearAmt}}</span>
<template data-scif value="{{f.agents}}" hint-placeholder-val="{{ false }}"><span style="font-family: {{t.fN}}; font-size: 11px; border: 1.5px dashed {{t.ink}}; padding: 1px 6px">AGENT ×{{f.agents}}</span></template>
</div>
<span style="font-family: {{t.fN}}; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; padding: 6px 8px; text-align: center; background: {{f.stBg}}; color: {{f.stFg}}; border-radius: {{t.rB}}">{{f.status}}</span>
</div>
</template>
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; margin-top: 12px; font-family: {{t.fN}}; font-size: 11px; color: {{t.muted}}; letter-spacing: 0.08em">
<span>SOLID = BULL · OUTLINED = BEAR · CLICK A FLOOR NUMBER TO PICK IT</span>
<span>PREMIUM = CLIMB PREMIUM, FLOORS 7 TO 10</span>
</div>
</template>

<template data-scif value="{{tw.building}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; align-items: center; padding-top: 6px">
<div aria-hidden="true" style="width: 2px; height: 30px; background: {{t.ink}}"></div>

      lbTabs: [['all', 'COMBINED'], ['HUMAN', 'HUMANS'], ['AGENT', 'AGENTS']].map(([k, label]) => ({ label, on: String(s.lb === k), pick: () => this.setState({ lb: k }), ...on(s.lb === k) })),
      isDash: s.screen === 'dash', isPos: s.screen === 'pos', isDoors: s.screen === 'doors', isBank: s.screen === 'bank',

      pickBull: () => this.setState({ side: 'bull' }), pickBear: () => this.setState({ side: 'bear' }),

      onAmt: (e) => { const v = parseFloat(String(e.target.value).replace(/,/g, '')); this.setState({ amount: isNaN(v) ? 0 : v }); },
      openPos: () => { this.setState({ posFloor: s.floor, agaruzo: true }); flash(); },
      climbPos: () => { if (s.posFloor < 10) { this.setState({ posFloor: s.posFloor + 1, agaruzo: true }); flash(); } },
      dropPos: () => this.setState({ posFloor: Math.max(1, s.posFloor - 1) }),

      pickDep: () => this.setState({ bank: 'dep' }), pickWd: () => this.setState({ bank: 'wd' }),
      bankVerb: isDep ? 'DEPOSIT' : 'WITHDRAW', bankCta: isDep ? 'DEPOSIT INTO THE BANK' : 'WITHDRAW MY SHARE',

      earn: [{ k: 'Trading fees', v: 'a cut of every move' }, { k: 'Funding', v: 'when it covers the crowded side' }, { k: 'Collapses', v: '25% of every penalty' }, { k: 'Cost', v: '1% a year on borrowed MUSD' }],
      winners: [{ when: 'Last week', who: '0x3b…91', amt: '0.431 MUSD' }, { when: '2 weeks ago', who: 'No draw yet', amt: '—' }],
      feed: [{ t: '14:02', m: 'FLOOR 09 BULLS DOWN · survivors +41.20', c: t.neg }, { t: '14:01', m: 'AGARUZO! 0x8f…c2 reached floor 08', c: t.hi }, { t: '13:58', m: 'kaidan.bot (agent) went bear on 03', c: t.bear }, { t: '13:55', m: 'Floor 10 premium now 1.21×', c: t.ink }, { t: '13:44', m: 'Safety jar +0.75', c: t.muted }]
    };
  }
}


const TPL = document.createElement('template');
TPL.innerHTML = document.getElementById('juu-template').textContent;
const app = document.getElementById('app');
const comp = new Component({});
let queued = false; const t0 = performance.now();
function schedule() { if (queued) return; queued = true; Promise.resolve().then(() => { queued = false; draw(); }); }
function draw() {
  const act = document.activeElement; const aid = act && act.id; let sel = null;
  try { if (aid && act.selectionStart != null) sel = [act.selectionStart, act.selectionEnd]; } catch (e) {}
  const frag = document.createDocumentFragment();
  renderNodes(TPL.content.childNodes, comp.renderVals(), frag, false);
  app.replaceChildren(frag);
  if (aid) { const el = document.getElementById(aid); if (el) { el.focus(); if (sel) try { el.setSelectionRange(sel[0], sel[1]); } catch (e) {} } }
  const secs = (performance.now() - t0) / 1000;
  document.querySelectorAll('.juu-tick').forEach((x) => { x.style.animationDelay = '-' + (secs % 52).toFixed(2) + 's'; });
}
draw();
